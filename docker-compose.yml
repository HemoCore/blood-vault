services:
  app:
    image: node:24-alpine
    working_dir: /app
    volumes:
      - .:/app
      - app-modules:/app/node_modules
      - app-npm:/root/.npm
    environment:
      PORT: "3000"
      HOST: "0.0.0.0"
    ports:
      - "3000:3000"
    init: true
    tty: true

  db:
    image: postgres:15-alpine
    container_name: blood-vault-db
    restart: always
    environment:
      POSTGRES_USER: blood_user
      POSTGRES_PASSWORD: blood_password
      POSTGRES_DB: blood_vault
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  app-modules:
  app-npm:
  pgdata: